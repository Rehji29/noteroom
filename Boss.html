                                --blue: #1f6fd6;

                        * {
                                box-sizing: border-box;
                                user-select: none;
                                -webkit-user-select: none;
                        }
                        html,
                        body {
                                margin: 0;
                                height: 100%;

                                height: 1024px;
                                transform-origin: center;
                                overflow: hidden;

                        .abs {
                                position: absolute;
                        }
                        .btn {
                                position: absolute;
                                border: 0;
                                border-radius: 50%;
                                background: var(--blue);
                                color: #fff;
                                font: 800 40px/1 inherit;
                                cursor: pointer;
                                box-shadow:
                                        0 5px 0 #0d3f8f,

                        .btn:active {

                        .logo {
                                left: 160px;
                                top: 14px;

                                color: var(--gold);
                                -webkit-text-stroke: 7px #1f4fa8;
                                paint-order: stroke fill;

                        .pill {
                                border-radius: 50px;
                                background: #2a8fd0;
                                box-shadow: 0 0 0 4px #fff4;
                        }
                        .bar {
                                height: 20px;
                                border-radius: 10px;
                                background: #d8d8d8;
                                overflow: hidden;
                        }
                        .bar i {
                                display: block;
                                height: 100%;
                                transition: width 0.5s;

                                left: 78px;
                                top: 176px;
                                width: 322px;
                                height: 530px;
                                background: var(--cream);
                                border-radius: 24px;
                                box-shadow:

                                top: 176px;

                                padding: 2px 22px;

                                border: 0;
                                border-radius: 12px;

                                color: #999;
                                cursor: pointer;

                        .diff button.on {

                                left: 583px;
                                top: 190px;
                                width: 372px;
                                height: 78px;
                                border-radius: 40px;
                                background: linear-gradient(#2f80e8, #1f64c8);

                                text-align: center;
                                box-shadow: 0 0 0 5px #fff;

                                60% {

                        const $ = (s) => document.querySelector(s),

                                const p = [];
                                for (let i = 0; i <= n; i++) {
                                        const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
                                        p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
                                }
                                return p;
                        };
                        const bowl = () => arc(60, 65, 55, 65, -35, -395, 32);

                                        ],
                                },
                                o: { w: 135, s: [arc(60, 65, 55, 65, -90, -450, 32)] },
                                g: {
                                        w: 135,
                                        s: [
                                                bowl(),
                                                [
                                                        [115, 0],
                                                        [115, 160],
                                                        [95, 205],
                                                        [55, 220],
                                                        [15, 205],
                                                ],
                                        ],
                                },
                                s: {
                                        w: 120,
                                        s: [
                                                [
                                                        [100, 20],
                                                        [80, 5],
                                                        [50, 0],
                                                        [25, 10],
                                                        [15, 30],
                                                        [30, 50],
                                                        [60, 65],
                                                        [95, 85],
                                                        [105, 108],
                                                        [90, 125],
                                                        [60, 130],
                                                        [30, 125],
                                                        [10, 105],
                                                ],
                                        ],
                                },
                                u: {
                                        w: 120,
                                        s: [
                                                [
                                                        [10, 0],
                                                        [10, 90],
                                                        [30, 122],
                                                        [60, 130],
                                                        [90, 118],
                                                        [105, 90],
                                                ],
                                                [
                                                        [105, 0],
                                                        [105, 130],
                                                ],
                                        ],
                                },
                                n: {
                                        w: 120,
                                        s: [
                                                [
                                                        [10, 0],
                                                        [10, 130],
                                                ],
                                                [
                                                        [10, 45],
                                                        [30, 8],
                                                        [60, 0],
                                                        [90, 10],
                                                        [103, 45],
                                                        [103, 130],
                                                ],
                                        ],
                                },
                                p: {
                                        w: 135,
                                        s: [
                                                [
                                                        [10, 0],
                                                        [10, 220],
                                                ],
                                                arc(62, 65, 52, 65, -135, 225, 32),
                                        ],
                                },
                                i: {
                                        w: 80,
                                        s: [
                                                [
                                                        [40, 0],
                                                        [40, 130],
                                                ],
                                                [
                                                        [40, -40],
                                                        [40, -38],
                                                ],
                                        ],
                                },
                                h: {
                                        w: 120,
                                        s: [
                                                [
                                                        [10, -130],
                                                        [10, 130],
                                                ],
                                                [
                                                        [10, 50],
                                                        [30, 10],
                                                        [60, 0],
                                                        [90, 10],
                                                        [103, 45],
                                                        [103, 130],
                                                ],
                                        ],
                                },
                        };
                        const WORDS = ["cat", "dog", "sun", "pig", "hat", "cup", "pan", "hid"],
                                BOSSES = [
                                        ["Notebook Boss", 0],
                                        ["Eraser Boss", 150],
                                        ["Ink Blot Boss", 290],
                                ];
                        const S = 1.05,
                                XH = 155,
                                TOLS = { easy: 24, medium: 17, hard: 12 },
                                NEED = 0.85,
                                DMG = 34;
                        let diff = "easy",
                                coins = 120,
                                xp = 33,
                                muted = false,
                                bi = 0,
                                wins = 0,
                                hp = 100,
                                hearts = 3,
                                done = 0,
                                order = [],
                                wi = 0,
                                word = "cat",
                                won = false,
                                busy = false,
                                drawing = false,
                                cur = null,
                                ink = [],
                                samples = [],
                                cov = [],
                                nStr = 0;
                        const TOL = () => TOLS[diff];
                        const say = (t) => {
                                if (muted || !window.speechSynthesis) return;
                                try {
                                        speechSynthesis.cancel();
                                        speechSynthesis.speak(new SpeechSynthesisUtterance(t));
                                } catch (e) {}
                        };
                        const talk = (t) => {
                                $("#bub").textContent = t;
                        };
                        const flash = (el, c, ms) => {
                                el.classList.remove(c);
                                void el.getBoundingClientRect();
                                el.classList.add(c);
                                setTimeout(() => el.classList.remove(c), ms);
                        };
                        function renderHud() {
                                $("#hearts").textContent = "❤️".repeat(hearts) + "🩶".repeat(3 - hearts);
                                $("#hp").style.width = hp + "%";
                                $("#gbar").style.width = (done / 3) * 100 + "%";
                                $("#gtxt").textContent = done + "/3";
                                $("#coins").textContent = coins;
                                $("#xp").style.width = xp + "%";
                        }
                        function shuffle() {
                                order = [...WORDS].sort(() => Math.random() - 0.5);
                                order = ["cat", ...order.filter((w) => w != "cat")];
                                wi = 0;
                        }
                        function startBattle() {
                                hp = 100;
                                hearts = 3;
                                done = 0;
                                busy = false;
                                shuffle();
                                $("#bname").textContent = BOSSES[bi][0];
                                $("#bsk").style.filter = `hue-rotate(${BOSSES[bi][1]}deg)`;
                                $("#boss").classList.remove("dead");
                                $("#ov").style.display = "none";
                                talk("You can do it!");
                                renderHud();
                                loadWord(order[0]);
                        }
                        function loadWord(w) {
                                word = w;
                                won = false;
                                ink = [];
                                cur = null;
                                $("#ink").innerHTML = "";
                                $("#wd").firstChild.textContent = w;
                                $("#bw").textContent = w;
                                $("#chk").textContent = "Check";
                                const tw = [...w].reduce((a, c) => a + G[c].w, 0) * S;
                                let x0 = (640 - tw) / 2,
                                        d = "",
                                        si = 0;
                                samples = [];
                                for (const ch of w) {
                                        for (const st of G[ch].s) {
                                                const P = st.map((p) => [x0 + p[0] * S, XH + p[1] * S]);
                                                d +=
                                                        "M" +
                                                        P.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
                                                for (let i = 1; i < P.length; i++) {
                                                        const [a, b] = [P[i - 1], P[i]],
                                                                n = Math.max(
                                                                        1,
                                                                        Math.round(
                                                                                Math.hypot(b[0] - a[0], b[1] - a[1]) / 8
                                                                        )
                                                                );
                                                        for (let k = i == 1 ? 0 : 1; k <= n; k++)
                                                                samples.push({
                                                                        x: a[0] + ((b[0] - a[0]) * k) / n,
                                                                        y: a[1] + ((b[1] - a[1]) * k) / n,
                                                                        s: si,
                                                                });
                                                }
                                                si++;
                                        }
                                        x0 += G[ch].w * S;
                                }
                                nStr = si;
                                cov = samples.map(() => false);
                                const g = $("#guide");
                                g.innerHTML = '<path d="' + d + '"/>';
                                g.style.opacity = diff == "hard" ? 0.3 : 1;
                                marker();
                        }
                        function marker() {
                                let t = null;
                                for (let s = 0; s < nStr; s++) {
                                        const ix = samples.map((p, i) => (p.s == s ? i : -1)).filter((i) => i >= 0);
                                        if (ix.filter((i) => cov[i]).length < ix.length * 0.8) {
                                                t = samples[ix[0]];
                                                break;
                                        }
                                }
                                const mk = $("#mk");
                                if (t && !won) {
                                        mk.style.display = "";
                                        mk.setAttribute("transform", `translate(${t.x} ${t.y})`);
                                } else mk.style.display = "none";
                        }
                        const pt = (e) => {
                                const s = $("#board"),
                                        p = s.createSVGPoint();
                                p.x = e.clientX;
                                p.y = e.clientY;
                                return p.matrixTransform(s.getScreenCTM().inverse());
                        };
                        function add(p) {
                                const last = cur.pts[cur.pts.length - 1],
                                        seg = [p];
                                if (last) {
                                        const d = Math.hypot(p.x - last.x, p.y - last.y),
                                                n = Math.floor(d / 5);
                                        for (let i = n; i >= 1; i--)
                                                seg.unshift({
                                                        x: last.x + ((p.x - last.x) * i) / (n + 1),
                                                        y: last.y + ((p.y - last.y) * i) / (n + 1),
                                                });
                                        seg.sort(
                                                (a, b) =>
                                                        Math.hypot(a.x - last.x, a.y - last.y) -
                                                        Math.hypot(b.x - last.x, b.y - last.y)
                                        );
                                }
                                seg.forEach((q) => {
                                        cur.pts.push(q);
                                        ink.push(q);
                                        samples.forEach((s, i) => {
                                                if (!cov[i] && Math.hypot(s.x - q.x, s.y - q.y) < TOL()) cov[i] = true;
                                        });
                                });
                                cur.el.setAttribute(
                                        "points",
                                        cur.pts.map((q) => q.x.toFixed(1) + "," + q.y.toFixed(1)).join(" ")
                                );
                        }
                        const bd = $("#board");
                        bd.addEventListener("pointerdown", (e) => {
                                if (won || busy) return;
                                bd.setPointerCapture(e.pointerId);
                                drawing = true;
                                const el = document.createElementNS(NS, "polyline");
                                $("#ink").appendChild(el);
                                cur = { pts: [], el };
                                add(pt(e));
                        });
                        bd.addEventListener("pointermove", (e) => {
                                if (drawing) add(pt(e));
                        });
                        const up = () => {
                                if (!drawing) return;
                                drawing = false;
                                marker();
                        };
                        bd.addEventListener("pointerup", up);
                        bd.addEventListener("pointercancel", up);
                        $("#try").onclick = $("#back").onclick = () => {
                                if (won || busy) return;
                                ink = [];
                                $("#ink").innerHTML = "";
                                cov = samples.map(() => false);
                                marker();
                                talk("Take your time!");
                        };
                        function burst(n = 14) {
                                for (let i = 0; i < n; i++) {
                                        const s = document.createElement("div");
                                        s.className = "star";
                                        s.textContent = ["⭐", "✨", "🌟"][i % 3];
                                        s.style.left = "1300px";
                                        s.style.top = "450px";
                                        s.style.setProperty("--x", Math.random() * 700 - 450 + "px");
                                        s.style.setProperty("--y", Math.random() * 500 - 250 + "px");
                                        $("#stage").appendChild(s);
                                        setTimeout(() => s.remove(), 1200);
                                }
                        }
                        function overlay(t, p, b, fn) {
                                $("#ot").textContent = t;
                                $("#op").textContent = p;
                                $("#ob").textContent = b;
                                $("#ob").onclick = fn;
                                $("#ov").style.display = "flex";
                        }
                        function unlock() {
                                const b = $("#diff").children;
                                if (wins >= 1 && b[1].classList.contains("lk")) {
                                        b[1].classList.remove("lk");
                                        b[1].textContent = "⭐ Medium";
                                }
                                if (wins >= 2 && b[2].classList.contains("lk")) {
                                        b[2].classList.remove("lk");
                                        b[2].textContent = "⭐ Hard";
                                }
                        }
                        $("#check").onclick = () => {
                                if (busy) return;
                                if (won) {
                                        loadWord(order[++wi % order.length]);
                                        return;
                                }
                                if (ink.length < 5) {
                                        talk("Trace the dots first!");
                                        return;
                                }
                                const c = cov.filter(Boolean).length / cov.length,
                                        on =
                                                ink.filter((q) =>
                                                        samples.some(
                                                                (s) => Math.hypot(s.x - q.x, s.y - q.y) < TOL() * 1.8
                                                        )
                                                ).length / ink.length;
                                if (c >= NEED && on >= 0.7) {
                                        hp = Math.max(0, hp - DMG);
                                        done++;
                                        coins += 10;
                                        xp += 25;
                                        if (xp >= 100) {
                                                xp -= 100;
                                                $("#lvl").textContent =
                                                        "Level " + (+$("#lvl").textContent.slice(6) + 1);
                                        }
                                        const d = document.createElement("div");
                                        d.className = "dmg";
                                        d.textContent = "-" + DMG;
                                        d.style.left = "1260px";
                                        d.style.top = "360px";
                                        $("#stage").appendChild(d);
                                        setTimeout(() => d.remove(), 1000);
                                        flash($("#boss"), "hurt", 600);
                                        burst(8);
                                        say(word);
                                        renderHud();
                                        if (hp <= 0) {
                                                busy = true;
                                                talk("Noooo!");
                                                setTimeout(() => {
                                                        $("#boss").classList.add("dead");
                                                        burst(24);
                                                }, 500);
                                                wins++;
                                                coins += 50;
                                                unlock();
                                                hearts = Math.min(3, hearts + 1);
                                                setTimeout(() => {
                                                        renderHud();
                                                        overlay(
                                                                "Boss defeated!",
                                                                "+50 coins · " +
                                                                        (wins == 1
                                                                                ? "Medium unlocked!"
                                                                                : wins == 2
                                                                                  ? "Hard unlocked!"
                                                                                  : "You are a word hero!"),
                                                                "Next boss",
                                                                () => {
                                                                        bi = (bi + 1) % BOSSES.length;
                                                                        startBattle();
                                                                }
                                                        );
                                                }, 1400);
                                        } else {
                                                won = true;
                                                marker();
                                                $("#chk").textContent = "Next word";
                                                talk(["Ouch!", "Argh!", "Not the pencils!"][done % 3]);
                                        }
                                } else {
                                        hearts--;
                                        busy = true;
                                        flash($("#boss"), "atk", 700);
                                        setTimeout(() => {
                                                flash($("#stage"), "shake", 400);
                                                renderHud();
                                                talk("Hah! Too messy!");
                                        }, 350);
                                        setTimeout(() => {
                                                busy = false;
                                                if (hearts <= 0) {
                                                        overlay(
                                                                "Oh no!",
                                                                "The boss got you. Try the battle again!",
                                                                "Try again",
                                                                () => startBattle()
                                                        );
                                                } else {
                                                        talk(c < NEED ? "Cover every letter!" : "Stay on the dots!");
                                                }
                                        }, 800);
                                }
                        };
                        $("#spk").onclick = () => {
                                muted = false;
                                say(word);
                        };
                        $("#gear").onclick = () => {
                                muted = !muted;
                                $("#gear").textContent = muted ? "🔇" : "⚙";
                                talk(muted ? "Sound off" : "Sound on");
                        };
                        $("#diff").onclick = (e) => {
                                const b = e.target.closest("button");
                                if (!b || busy) return;
                                if (b.classList.contains("lk")) {
                                        talk(
                                                b.dataset.d == "medium"
                                                        ? "Beat 1 boss to unlock!"
                                                        : "Beat 2 bosses to unlock!"
                                        );
                                        return;
                                }
                                [...$("#diff").children].forEach((x) => x.classList.remove("on"));
                                b.classList.add("on");
                                diff = b.dataset.d;
                                ink = [];
                                $("#ink").innerHTML = "";
                                cov = samples.map(() => false);
                                $("#guide").style.opacity = diff == "hard" ? 0.3 : 1;
                                marker();
                        };
                        function fit() {
                                const s = Math.min(innerWidth / 1536, innerHeight / 1024);
                                $("#stage").style.transform = `translate(-50%,-50%) scale(${s})`;
                        }
                        addEventListener("resize", fit);
                        fit();
                        startBattle();
                </script>
        </body>
</html>
