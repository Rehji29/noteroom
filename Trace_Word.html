<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Noteroom – Trace the Word</title>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
        <style>
            :root {
                --sky: #8fcdf8;
                --blue: #1f6fd6;
                --navy: #0d3f8f;
                --green: #1fa653;
                --cream: #fff7e6;
                --gold: #f7c948;
                color-scheme: light;
            }
            * {
                box-sizing: border-box;
                user-select: none;
                -webkit-user-select: none;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: var(--sky);
                font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
                color: var(--navy);
            }
            #stage {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 1536px;
                height: 1024px;
                transform-origin: center;
                overflow: hidden;
                background: linear-gradient(
                    #8fcdf8 0,
                    #d3ecfb 330px,
                    #f3dcb8 331px,
                    #f3dcb8 760px,
                    #e8b27a 761px,
                    #d79a5e 1024px
                );
            }
            .abs {
                position: absolute;
            }
            .btn {
                position: absolute;
                border: 0;
                border-radius: 50%;
                background: var(--blue);
                color: #fff;
                font: 800 40px/1 inherit;
                cursor: pointer;
                box-shadow:
                    0 5px 0 #0d3f8f,
                    0 0 0 4px #fff;
            }
            .btn:active {
                transform: translateY(3px);
            }
            .logo {
                left: 160px;
                top: 14px;
                font: 800 74px/1 "Baloo 2";
                color: var(--gold);
                -webkit-text-stroke: 7px #1f4fa8;
                paint-order: stroke fill;
            }
            .pill {
                border-radius: 50px;
                background: #2a8fd0;
                box-shadow: 0 0 0 4px #fff4;
            }
            .bar {
                height: 20px;
                border-radius: 10px;
                background: #d8d8d8;
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                background: var(--gold);
                transition: width 0.5s;
            }
            .frame {
                left: 243px;
                top: 272px;
                width: 1050px;
                height: 500px;
                border-radius: 46px;
                background: var(--cream);
                border: 22px solid #d99a55;
                box-shadow: 0 10px 0 #0003;
            }
            .banner {
                left: 490px;
                top: 128px;
                width: 560px;
                height: 122px;
                border-radius: 30px;
                background: linear-gradient(#fff0c4, #fbdc93);
                border: 5px solid #e3b25c;
                box-shadow: 0 7px 0 #0003;
                text-align: center;
            }
            .big {
                position: absolute;
                top: 785px;
                height: 90px;
                border-radius: 45px;
                border: 0;
                font: 800 34px "Baloo 2";
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                box-shadow:
                    0 0 0 5px #fff,
                    0 8px 0 #0003;
            }
            .big:active {
                transform: translateY(4px);
            }
            #try {
                left: 408px;
                width: 290px;
                background: #fff;
                color: var(--blue);
                box-shadow:
                    0 0 0 5px #8fc3f0,
                    0 8px 0 #0003;
            }
            #check {
                left: 735px;
                width: 400px;
                background: linear-gradient(#2dbd63, #1a9a4a);
                color: #fff;
            }
            .note {
                left: 1330px;
                top: 350px;
                width: 190px;
                height: 230px;
                background: #ffe9a8;
                border-radius: 12px;
                transform: rotate(3deg);
                box-shadow: 0 8px 0 #0003;
                text-align: center;
                padding-top: 14px;
                font: 800 28px/1.05 "Baloo 2";
                color: #1a5fc4;
            }
            .goal {
                left: 86px;
                top: 900px;
                width: 880px;
                height: 92px;
                border-radius: 46px;
                background: var(--cream);
                box-shadow: 0 6px 0 #0003;
            }
            #nextb {
                left: 1263px;
                top: 900px;
                width: 250px;
                height: 92px;
                border-radius: 46px;
                background: #fff;
                border: 0;
                box-shadow:
                    0 0 0 5px #e8d7f3,
                    0 6px 0 #0003;
                font: 800 32px "Baloo 2";
                color: #6a4a92;
                cursor: pointer;
            }
            #board {
                touch-action: none;
                cursor: crosshair;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }
            @keyframes pop {
                0% {
                    transform: rotate(3deg) scale(0.7);
                }
                60% {
                    transform: rotate(3deg) scale(1.12);
                }
                100% {
                    transform: rotate(3deg) scale(1);
                }
            }
            @keyframes fly {
                to {
                    transform: translate(var(--x), var(--y)) rotate(360deg);
                    opacity: 0;
                }
            }
            .star {
                position: absolute;
                font-size: 44px;
                animation: fly 1.1s ease-out forwards;
                pointer-events: none;
            }
            @media (prefers-reduced-motion: reduce) {
                .star {
                    display: none;
                }
                .note {
                    animation: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="stage">
            <div
                class="abs"
                style="left: 0; top: 0; width: 1536px; height: 122px; background: linear-gradient(#7cc4f6, #a8d9fa)"
            ></div>
            <div
                class="abs"
                style="
                    left: 0;
                    top: 122px;
                    width: 1536px;
                    height: 640px;
                    background: repeating-linear-gradient(
                        90deg,
                        transparent 0 60px,
                        rgba(255, 255, 255, 0.18) 60px 64px
                    );
                "
            ></div>
            <a
                href="Activity_page.html"
                class="btn"
                id="back"
                style="left: 34px; top: 26px; width: 72px; height: 72px"
                aria-label="Back"
                ><img src="Back.svg" style="width: 72px; height: 72px"
            /></a>
            <div class="abs logo">Noteroom</div>
            <div class="abs pill" style="left: 538px; top: 16px; width: 390px; height: 90px">
                <div
                    class="abs"
                    style="
                        left: 10px;
                        top: 7px;
                        width: 76px;
                        height: 76px;
                        border-radius: 50%;
                        background: #ffe3c2;
                        border: 4px solid #fff;
                        font-size: 52px;
                        text-align: center;
                        line-height: 68px;
                    "
                >
                    🧒
                </div>
                <div class="abs" style="left: 106px; top: 6px; color: #fff; font: 700 26px/1 &quot;Baloo 2&quot;">
                    Student
                </div>
                <div
                    class="abs"
                    style="left: 106px; top: 36px; color: #fff; font: 600 20px/1 &quot;Baloo 2&quot;"
                    id="lvl"
                >
                    Level 2
                </div>
                <div class="abs bar" style="left: 106px; top: 62px; width: 250px; height: 14px; background: #1b5b8f">
                    <i id="xp" style="width: 33%"></i>
                </div>
            </div>
            <div class="abs pill" style="left: 1070px; top: 26px; width: 208px; height: 62px; background: #1c4b7d">
                <div
                    class="abs"
                    style="
                        left: 0;
                        top: -4px;
                        width: 66px;
                        height: 66px;
                        border-radius: 50%;
                        background: var(--gold);
                        border: 4px solid #e6a512;
                        font-size: 34px;
                        text-align: center;
                        line-height: 56px;
                        color: #fff;
                    "
                >
                    ★
                </div>
                <div
                    class="abs"
                    id="coins"
                    style="left: 100px; top: 6px; color: #fff; font: 800 40px &quot;Baloo 2&quot;"
                >
                    120
                </div>
            </div>
            <button
                class="btn"
                id="gear"
                style="left: 1434px; top: 20px; width: 72px; height: 72px; font-size: 36px"
                aria-label="Sound on/off"
            >
                ⚙
            </button>

            <div
                class="abs"
                style="
                    left: 93px;
                    top: 166px;
                    width: 250px;
                    height: 82px;
                    border-radius: 26px;
                    background: #fff;
                    box-shadow:
                        0 0 0 4px #bfe0f8,
                        0 6px 0 #0002;
                    padding: 8px 0 0 80px;
                    line-height: 1.05;
                    font: 800 24px/1.05 &quot;Baloo 2&quot;;
                "
            >
                Word Practice
                <div style="font: 600 20px &quot;Baloo 2&quot;; color: #5a7aa8" id="wl">Level 1</div>
                <div class="abs" style="left: 16px; top: 14px; font-size: 50px">📘</div>
            </div>
            <div class="abs banner">
                <div style="font: 800 52px/1 &quot;Baloo 2&quot;; margin-top: 14px; color: #1a4fa8">
                    ✏️ Trace the word
                </div>
                <div style="font: 600 24px &quot;Baloo 2&quot;; color: #7a5a20; margin-top: 6px">
                    Follow the guides and write the word.
                </div>
            </div>
            <button
                class="btn"
                id="spk"
                style="left: 1270px; top: 158px; width: 92px; height: 92px; font-size: 46px"
                aria-label="Say the word"
            >
                🔊
            </button>

            <div class="abs frame">
                <svg id="board" viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet">
                    <line x1="10" x2="990" y1="18" y2="18" stroke="#a9d8f5" stroke-width="3" stroke-dasharray="22 14" />
                    <line x1="10" x2="990" y1="174" y2="174" stroke="#f3a6ad" stroke-width="3" />
                    <line x1="10" x2="990" y1="330" y2="330" stroke="#ccc" stroke-width="3" />
                    <g
                        id="guide"
                        fill="none"
                        stroke="#9aa6b8"
                        stroke-width="15"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-dasharray="1 24"
                    ></g>
                    <g
                        id="ink"
                        fill="none"
                        stroke="#2a7de1"
                        stroke-width="20"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        opacity=".85"
                    ></g>
                    <g id="mk">
                        <circle r="20" fill="#1fa653" stroke="#fff" stroke-width="4" />
                        <path
                            d="M0 -8V8M-7 1L0 8L7 1"
                            stroke="#fff"
                            stroke-width="5"
                            fill="none"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </g>
                </svg>
            </div>

            <div class="abs note" id="note">
                <div style="font-size: 92px; line-height: 1.1" id="pet">🐱</div>
                <div id="coach">You can do it!</div>
            </div>
            <div class="abs" style="left: -10px; top: 560px; font-size: 190px">📚</div>
            <div class="abs" style="left: 40px; top: 430px; font-size: 110px">🖍️</div>
            <div class="abs" style="left: 1390px; top: 620px; font-size: 170px">🪴</div>

            <button class="big" id="try"><span style="font-size: 44px">↻</span>Try Again</button>
            <button class="big" id="check">
                <span style="font-size: 40px">✏️</span><span id="chk">Check Writing</span>
            </button>
            <div class="abs goal">
                <div class="abs" style="left: 24px; top: 14px; font-size: 58px">🏆</div>
                <div class="abs" style="left: 100px; top: 10px; font: 800 26px &quot;Baloo 2&quot;">Today’s Goal</div>
                <div class="abs" style="left: 100px; top: 44px; font: 600 21px &quot;Baloo 2&quot;; color: #667">
                    Complete 1 word
                </div>
                <div class="abs bar" style="left: 330px; top: 36px; width: 440px">
                    <i id="gbar" style="width: 0"></i>
                </div>
                <div class="abs" id="gtxt" style="left: 795px; top: 26px; font: 800 28px &quot;Baloo 2&quot;">0/1</div>
            </div>
            <button class="abs" id="nextb"><span id="nxe">🐶</span> Next ›</button>
        </div>
        <script>
            const $ = (s) => document.querySelector(s),
                NS = "http://www.w3.org/2000/svg";
            const arc = (cx, cy, rx, ry, a0, a1, n = 24) => {
                const p = [];
                for (let i = 0; i <= n; i++) {
                    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
                    p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
                }
                return p;
            };
            const bowl = () => arc(60, 65, 55, 65, -35, -395, 32);
            /* y: 0 = x-height top, 130 = baseline, -130 = ascender, 220 = descender */
            const G = {
                c: { w: 130, s: [arc(62, 65, 55, 65, -40, -320, 28)] },
                a: {
                    w: 135,
                    s: [
                        bowl(),
                        [
                            [115, 0],
                            [115, 130],
                        ],
                    ],
                },
                t: {
                    w: 100,
                    s: [
                        [
                            [45, -55],
                            [45, 100],
                            [60, 124],
                            [88, 130],
                        ],
                        [
                            [8, 0],
                            [88, 0],
                        ],
                    ],
                },
                d: {
                    w: 135,
                    s: [
                        bowl(),
                        [
                            [115, -130],
                            [115, 130],
                        ],
                    ],
                },
                o: { w: 135, s: [arc(60, 65, 55, 65, -90, -450, 32)] },
                g: {
                    w: 135,
                    s: [
                        bowl(),
                        [
                            [115, 0],
                            [115, 160],
                            [95, 205],
                            [55, 220],
                            [15, 205],
                        ],
                    ],
                },
                s: {
                    w: 120,
                    s: [
                        [
                            [100, 20],
                            [80, 5],
                            [50, 0],
                            [25, 10],
                            [15, 30],
                            [30, 50],
                            [60, 65],
                            [95, 85],
                            [105, 108],
                            [90, 125],
                            [60, 130],
                            [30, 125],
                            [10, 105],
                        ],
                    ],
                },
                u: {
                    w: 120,
                    s: [
                        [
                            [10, 0],
                            [10, 90],
                            [30, 122],
                            [60, 130],
                            [90, 118],
                            [105, 90],
                        ],
                        [
                            [105, 0],
                            [105, 130],
                        ],
                    ],
                },
                n: {
                    w: 120,
                    s: [
                        [
                            [10, 0],
                            [10, 130],
                        ],
                        [
                            [10, 45],
                            [30, 8],
                            [60, 0],
                            [90, 10],
                            [103, 45],
                            [103, 130],
                        ],
                    ],
                },
                p: {
                    w: 135,
                    s: [
                        [
                            [10, 0],
                            [10, 220],
                        ],
                        arc(62, 65, 52, 65, -135, 225, 32),
                    ],
                },
                i: {
                    w: 80,
                    s: [
                        [
                            [40, 0],
                            [40, 130],
                        ],
                        [
                            [40, -40],
                            [40, -38],
                        ],
                    ],
                },
                h: {
                    w: 120,
                    s: [
                        [
                            [10, -130],
                            [10, 130],
                        ],
                        [
                            [10, 50],
                            [30, 10],
                            [60, 0],
                            [90, 10],
                            [103, 45],
                            [103, 130],
                        ],
                    ],
                },
            };
            const W = [
                ["cat", "🐱"],
                ["dog", "🐶"],
                ["sun", "☀️"],
                ["pig", "🐷"],
                ["hat", "🎩"],
            ];
            const S = 1.2,
                XH = 174,
                TOL = 26,
                NEED = 0.85;
            let idx = 0,
                coins = 120,
                xp = 33,
                goal = 0,
                muted = false,
                won = false,
                drawing = false,
                cur = null,
                ink = [],
                samples = [],
                cov = [],
                nStr = 0;
            const say = (t) => {
                if (muted || !window.speechSynthesis) return;
                try {
                    speechSynthesis.cancel();
                    speechSynthesis.speak(new SpeechSynthesisUtterance(t));
                } catch (e) {}
            };
            const coach = (t) => {
                $("#coach").textContent = t;
            };
            function load() {
                const w = W[idx][0];
                won = false;
                ink = [];
                cur = null;
                $("#ink").innerHTML = "";
                const tw = [...w].reduce((a, c) => a + G[c].w, 0) * S;
                let x0 = (1000 - tw) / 2,
                    d = "",
                    si = 0;
                samples = [];
                for (const ch of w) {
                    for (const st of G[ch].s) {
                        const P = st.map((p) => [x0 + p[0] * S, XH + p[1] * S]);
                        d += "M" + P.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
                        for (let i = 1; i < P.length; i++) {
                            const [a, b] = [P[i - 1], P[i]],
                                n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 9));
                            for (let k = i == 1 ? 0 : 1; k <= n; k++)
                                samples.push({
                                    x: a[0] + ((b[0] - a[0]) * k) / n,
                                    y: a[1] + ((b[1] - a[1]) * k) / n,
                                    s: si,
                                });
                        }
                        si++;
                    }
                    x0 += G[ch].w * S;
                }
                nStr = si;
                cov = samples.map(() => false);
                $("#guide").innerHTML = '<path d="' + d + '"/>';
                $("#wl").textContent = "Level " + (idx + 1);
                $("#chk").textContent = "Check Writing";
                $("#pet").textContent = W[idx][1];
                coach("You can do it!");
                $("#nxe").textContent = W[(idx + 1) % W.length][1];
                marker();
            }
            function marker() {
                let t = null;
                for (let s = 0; s < nStr; s++) {
                    const ix = samples.map((p, i) => (p.s == s ? i : -1)).filter((i) => i >= 0);
                    if (ix.filter((i) => cov[i]).length < ix.length * 0.8) {
                        t = samples[ix[0]];
                        break;
                    }
                }
                const mk = $("#mk");
                if (t && !won) {
                    mk.style.display = "";
                    mk.setAttribute("transform", `translate(${t.x} ${t.y})`);
                } else mk.style.display = "none";
            }
            const pt = (e) => {
                const s = $("#board"),
                    p = s.createSVGPoint();
                p.x = e.clientX;
                p.y = e.clientY;
                return p.matrixTransform(s.getScreenCTM().inverse());
            };
            function add(p) {
                const last = cur.pts[cur.pts.length - 1],
                    seg = [p];
                if (last) {
                    const d = Math.hypot(p.x - last.x, p.y - last.y),
                        n = Math.floor(d / 6);
                    for (let i = n; i >= 1; i--)
                        seg.unshift({
                            x: last.x + ((p.x - last.x) * i) / (n + 1),
                            y: last.y + ((p.y - last.y) * i) / (n + 1),
                        });
                    seg.sort((a, b) => Math.hypot(a.x - last.x, a.y - last.y) - Math.hypot(b.x - last.x, b.y - last.y));
                }
                seg.forEach((q) => {
                    cur.pts.push(q);
                    ink.push(q);
                    samples.forEach((s, i) => {
                        if (!cov[i] && Math.hypot(s.x - q.x, s.y - q.y) < TOL) cov[i] = true;
                    });
                });
                cur.el.setAttribute("points", cur.pts.map((q) => q.x.toFixed(1) + "," + q.y.toFixed(1)).join(" "));
            }
            const bd = $("#board");
            bd.addEventListener("pointerdown", (e) => {
                if (won) return;
                bd.setPointerCapture(e.pointerId);
                drawing = true;
                const el = document.createElementNS(NS, "polyline");
                $("#ink").appendChild(el);
                cur = { pts: [], el };
                add(pt(e));
            });
            bd.addEventListener("pointermove", (e) => {
                if (drawing) add(pt(e));
            });
            const up = () => {
                if (!drawing) return;
                drawing = false;
                marker();
            };
            bd.addEventListener("pointerup", up);
            bd.addEventListener("pointercancel", up);
            $("#try").onclick = $("#back").onclick = () => {
                if (won) return;
                ink = [];
                $("#ink").innerHTML = "";
                cov = samples.map(() => false);
                marker();
                coach("Try again!");
            };
            function burst() {
                for (let i = 0; i < 14; i++) {
                    const s = document.createElement("div");
                    s.className = "star";
                    s.textContent = ["⭐", "✨", "🌟"][i % 3];
                    s.style.left = "770px";
                    s.style.top = "480px";
                    s.style.setProperty("--x", Math.random() * 900 - 450 + "px");
                    s.style.setProperty("--y", Math.random() * 600 - 350 + "px");
                    $("#stage").appendChild(s);
                    setTimeout(() => s.remove(), 1200);
                }
            }
            $("#check").onclick = () => {
                if (won) {
                    idx = (idx + 1) % W.length;
                    load();
                    return;
                }
                if (ink.length < 5) {
                    coach("Trace the dots first!");
                    return;
                }
                const c = cov.filter(Boolean).length / cov.length,
                    on =
                        ink.filter((q) => samples.some((s) => Math.hypot(s.x - q.x, s.y - q.y) < TOL * 1.8)).length /
                        ink.length;
                if (c >= NEED && on >= 0.7) {
                    won = true;
                    marker();
                    coach("Great job!");
                    $("#note").style.animation = "pop .5s";
                    $("#chk").textContent = "Next word";
                    coins += 10;
                    xp += 25;
                    if (xp >= 100) {
                        xp -= 100;
                        $("#lvl").textContent = "Level " + (+$("#lvl").textContent.slice(6) + 1);
                    }
                    goal = 1;
                    $("#coins").textContent = coins;
                    $("#xp").style.width = xp + "%";
                    $("#gbar").style.width = "100%";
                    $("#gtxt").textContent = "1/1";
                    burst();
                    say(W[idx][0]);
                } else coach(c < NEED ? "Almost! Cover every letter." : "Stay on the dots!");
            };
            $("#nextb").onclick = () => {
                idx = (idx + 1) % W.length;
                load();
            };
            $("#spk").onclick = () => {
                muted = false;
                say(W[idx][0]);
            };
            $("#gear").onclick = () => {
                muted = !muted;
                $("#gear").textContent = muted ? "🔇" : "⚙";
                coach(muted ? "Sound off" : "Sound on");
            };
            function fit() {
                const s = Math.min(innerWidth / 1536, innerHeight / 1024);
                $("#stage").style.transform = `translate(-50%,-50%) scale(${s})`;
            }
            addEventListener("resize", fit);
            fit();
            load();
        </script>
    </body>
</html>
